<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuril - Personal Mountain Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=DM+Sans:wght@400;700&family=Montserrat:wght@400&family=Roboto:wght@400&family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark-bg: #171717;
            --dark-bg-2: #272727;
            --green: #34C759;
            --orange: #FB6413;
            --orange-light: #FD8439;
            --white: #ffffff;
            --gray-light: #F2F3F6;
            --gray-text: #344053;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Afacad', sans-serif;
            background: var(--dark-bg);
            color: var(--white);
            overflow-x: hidden;
        }

        /* === WRAPPER === */
        .page-wrapper {
            max-width: 1512px;
            margin: 0 auto;
            position: relative;
        }

        /* === NAVBAR (sticky glass overlay) === */
        .navbar-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            max-width: 1298px;
            width: auto;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .navbar-overlay.scrolled {
            top: 12px;
            background: rgba(23, 23, 23, 0.95);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }
        .nav-item {
            font-family: 'Afacad', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: var(--white);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 60px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
        }
        .nav-item:hover { 
            background: rgba(255,255,255,0.1); 
            color: var(--white);
        }
        .nav-item.active {
            background: var(--green);
            font-weight: 700;
            color: var(--dark-bg);
            box-shadow: 0 2px 12px rgba(52, 199, 89, 0.35);
        }
        .nav-item.active:hover {
            background: var(--green);
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.5);
        }

        /* === SECTION IMAGE BLOCKS === */
        .section-block {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .section-block img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* === INTERACTIVE OVERLAYS === */
        .overlay-link {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 60px;
            z-index: 10;
        }
        .overlay-link:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.3);
        }

        /* Hero CTA buttons */
        .hero-portfolio-btn {
            bottom: 3.5%;
            left: 38.5%;
            width: 9%;
            height: 3.5%;
        }
        .hero-contact-btn {
            bottom: 3.5%;
            left: 48%;
            width: 9%;
            height: 3.5%;
        }

        /* === FADE-IN ANIMATION === */
        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === MARQUEE ANIMATION === */
        .marquee-wrapper {
            position: relative;
            overflow: hidden;
            background: var(--orange);
        }
        .marquee-track {
            display: flex;
            animation: marqueeScroll 25s linear infinite;
            white-space: nowrap;
        }
        .marquee-item {
            font-family: 'Afacad', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: var(--white);
            padding: 30px 40px;
            flex-shrink: 0;
        }
        .marquee-dot { opacity: 0.5; }
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* === FOOTER INTERACTIVE === */
        .footer-contact-btn {
            top: 5%;
            right: 8%;
            width: 10%;
            height: 5%;
        }
        .footer-email-area {
            bottom: 18%;
            right: 5%;
            width: 22%;
            height: 5%;
        }

        /* === SCROLL INDICATOR === */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--green), var(--orange));
            z-index: 9999;
            transition: width 0.1s;
        }

        /* === RESPONSIVE === */
        @media (max-width: 1200px) {
            .navbar-overlay {
                width: auto;
                max-width: calc(100% - 80px);
            }
            .nav-item {
                font-size: 16px;
                padding: 12px 22px;
            }
        }
        @media (max-width: 768px) {
            .navbar-overlay {
                width: auto;
                max-width: calc(100% - 32px);
                flex-wrap: wrap;
                justify-content: center;
                gap: 2px;
                padding: 6px;
                top: 10px;
            }
            .nav-item {
                font-size: 13px;
                padding: 8px 14px;
            }
            .marquee-item {
                font-size: 28px;
                padding: 20px 24px;
            }
        }

        /* === CUSTOM CURSOR ON INTERACTIVE AREAS === */
        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Sticky Navbar -->
    <nav class="navbar-overlay" id="navbar">
        <a href="#home" class="nav-item active">Home</a>
        <a href="#about" class="nav-item">About</a>
        <a href="#services" class="nav-item">Service</a>
        <a href="#journey" class="nav-item">Resume</a>
        <a href="#mountains" class="nav-item">Project</a>
        <a href="#contact" class="nav-item">Contact</a>
    </nav>

    <div class="page-wrapper">

        <!-- HERO SECTION -->
        <section id="home" class="section-block">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/0359c59f-45f0-4091-82d4-76af2b63ac18" alt="Hero - I'm Nuril, Personal Guide">
            <!-- CTA Buttons (invisible clickable overlays) -->
            <a href="#mountains" class="overlay-link hero-portfolio-btn" title="View Portfolio"></a>
            <a href="#contact" class="overlay-link hero-contact-btn" title="Contact Me"></a>
        </section>

        <!-- SERVICES SECTION -->
        <section id="services" class="section-block fade-in">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/ac014a91-7ae8-41a8-a450-521563768915" alt="My Services - Private Mountain Guide, Trip Planning, Beginner Friendly Hiking">
        </section>

        <!-- MOUNTAINS EXPLORED -->
        <section id="mountains" class="section-block fade-in">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/2d757a33-66dc-4d09-b83b-14ced1f64d35" alt="Mountains I've Explored - Merbabu, Sindoro, Sumbing, Prau, Lawu, Batur">
        </section>

        <!-- ABOUT / WHY HIKING -->
        <section id="about" class="section-block fade-in">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/cf6a08b0-a295-4470-ba64-2d0aca01bb70" alt="Why Hiking With Me - Seven Summits of Central Java">
            <a href="#contact" class="clickable-area" style="bottom:12%;right:15%;width:12%;height:6%;" title="Contact Me"></a>
        </section>

        <!-- MOUNTAIN JOURNEY -->
        <section id="journey" class="section-block fade-in">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/392944de-e70c-4864-bd60-a597e92d68ed" alt="Lets have a look at my Mountain Journey">
        </section>

        <!-- TESTIMONIALS -->
        <section class="section-block fade-in">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/a5506246-66c3-4829-aa79-f7b281055e0b" alt="Testimonials That Speak to My Journey">
        </section>

        <!-- MARQUEE (animated, not image) -->
        <div class="marquee-wrapper">
            <div class="marquee-track">
                <span class="marquee-item">Walking Beside You to Every Summit</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Walk With Me</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Mountains</span>
                <span class="marquee-item">Walking Beside You to Every Summit</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Walk With Me</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Mountains</span>
                <span class="marquee-item">Walking Beside You to Every Summit</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Walk With Me</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Mountains</span>
                <span class="marquee-item">Walking Beside You to Every Summit</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Walk With Me</span>
                <span class="marquee-item"><span class="marquee-dot">•</span> Mountains</span>
            </div>
        </div>

        <!-- FOOTER -->
        <section id="contact" class="section-block">
            <img src="https://figma-alpha-api.s3.us-west-2.amazonaws.com/images/c1dd0f1d-64c9-41a8-a5f2-570c79110889" alt="Lets Connect - Contact Nuril">
            <a href="mailto:nuril.f27@gmail.com" class="overlay-link footer-contact-btn" title="Contact Me"></a>
        </section>

    </div>

    <script>
        // === Scroll Progress Bar ===
        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = (scrollTop / scrollHeight) * 100;
            document.getElementById('scrollProgress').style.width = progress + '%';
        });

        // === Intersection Observer for Fade-In ===
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.05, rootMargin: '0px 0px -50px 0px' });

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

        // === Active Nav Highlight on Scroll ===
        const navItems = document.querySelectorAll('.nav-item');
        const navbar = document.getElementById('navbar');

        // Section IDs in the order they appear on the page (top to bottom)
        const sectionIds = ['home', 'services', 'mountains', 'about', 'journey', 'contact'];

        function updateActiveNav() {
            const scrollPos = window.scrollY + 200;
            let current = 'home';

            for (const id of sectionIds) {
                const section = document.getElementById(id);
                if (section && section.offsetTop <= scrollPos) {
                    current = id;
                }
            }

            navItems.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) {
                    link.classList.add('active');
                }
            });
        }

        // === Navbar scrolled state (subtle visual change) ===
        function updateNavbarState() {
            if (window.scrollY > 100) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }

        // Combine scroll listeners for performance
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    updateActiveNav();
                    updateNavbarState();
                    ticking = false;
                });
                ticking = true;
            }
        });

        // === Smooth Scroll on Nav Click ===
        navItems.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const target = document.getElementById(targetId);
                if (target) {
                    const offset = 100;
                    const top = target.offsetTop - offset;
                    window.scrollTo({ top, behavior: 'smooth' });
                }

                // Immediately set active state on click
                navItems.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Run once on page load
        updateActiveNav();
    </script>
</body>
</html>
